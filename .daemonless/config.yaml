# dbuild configuration file
# Full reference: https://github.com/daemonless/dbuild

build:
  architectures:
    - amd64
    - aarch64
  variants:
    - tag: latest
      containerfile: Containerfile
    # pkg-latest is an alias of pkg until the 15 latest repo has seaweedfs
    # again: seaweedfs-4.45_2 failed its distfile fetch in the 2026-10-23
    # package run, and a failed variant blocks the manifests for the others.
    - tag: pkg
      containerfile: Containerfile.pkg
      aliases: ["pkg-latest"]

cit:
  mode: health
  port: 9333
  health: /cluster/healthz
